<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number</title>

    <script>
        function checkPrime(){
            let num=parseInt(document.getElementById("num").value);
            if(num<2){
                document.getElementById("res").innerHTML=num+" is NOT a Prime number:";
                return;
            }
            for(let i=2; i<num; i++){
                if(num % i == 0){
                    document.getElementById("res").innerHTML=num+" is NOT a Prime number:";
                    return;
                }
            }
            document.getElementById("res").innerHTML=num+" is a Prime number:";
        }
    </script>

</head>

<body>
    <h1>Prime Number Check</h1>
    <br>
    Enter a number:<input type="text"id="num">
    <br><br>
    <button onclick="checkPrime()">CheckPrime</button>
    <p id="res"></p>
    
</body>

</html>
